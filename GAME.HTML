<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล่องสุ่มรัก</title>
    <style>
        body {
            background-color: #ffe6f2;
            text-align: center;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        #game-area {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid black;
            background-color: lightgray;
            margin-right: 20px;
        }
        .instructions {
            max-width: 300px;
            text-align: left;
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .target {
            width: 50px;
            height: 50px;
            position: absolute;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
        }
        .target img {
            width: 50px;
            height: 50px;
        }
        button {
            background-color: pink;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            border-radius: 5px;
        }
        button:hover {
            background-color: hotpink;
        }
    </style>
</head>
<body>
    <h1>กล่องสุ่มรัก</h1>
    <p>Score: <span id="score">0</span></p>
    <p>Time Left: <span id="time">10</span> seconds</p>
    <div class="container">
        <div id="game-area"></div>
        <div class="instructions">
            <h3>วิธีเล่นเกม</h3>
            <p>1. กดปุ่ม "Start Game" เพื่อเริ่มเล่น</p>
            <p>2. คลิกที่หัวใจที่ปรากฏขึ้นบนหน้าจอเพื่อทำคะแนน</p>
            <p>3. เกมจะสิ้นสุดลงเมื่อเวลาหมด</p>
            <p>4. กด "Reset Game" เพื่อเริ่มใหม่</p>
            <p>พยายามทำคะแนนให้ได้มากที่สุดก่อนเวลาจะหมด!</p>
        </div>
    </div>
    <button onclick="startGame()">Start Game</button>
    <button onclick="resetGame()">Reset Game</button>

    <script>
        let score = 0;
        let timeLeft = 10;
        let timer;
        let gameArea = document.getElementById("game-area");
        let scoreDisplay = document.getElementById("score");
        let timeDisplay = document.getElementById("time");

        function startGame() {
            score = 0;
            timeLeft = 10;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            clearInterval(timer);
            spawnTarget();
            timer = setInterval(() => {
                timeLeft--;
                timeDisplay.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    alert("Game Over! Your score: " + score);
                    gameArea.innerHTML = "";
                }
            }, 1000);
        }

        function resetGame() {
            clearInterval(timer);
            score = 0;
            timeLeft = 10;
            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            gameArea.innerHTML = "";
        }

        function spawnTarget() {
            let target = document.createElement("div");
            target.classList.add("target");
            target.style.left = Math.random() * 350 + "px";
            target.style.top = Math.random() * 350 + "px";
            
            let heartImg = document.createElement("img");
            heartImg.src = "https://cdn-icons-png.flaticon.com/512/833/833472.png"; // รูปหัวใจ
            heartImg.alt = "Heart";
            
            let text = document.createElement("span");
            text.textContent = "PALM";
            
            target.appendChild(heartImg);
            target.appendChild(text);
            target.onclick = () => {
                score++;
                scoreDisplay.textContent = score;
                target.remove();
                spawnTarget();
            };
            gameArea.innerHTML = "";
            gameArea.appendChild(target);
        }
    </script>
</body>
</html>
